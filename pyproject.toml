[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lzib-movements"
version = "0.1.0"
description = "Private Bratislava Airport aircraft movement alerts"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "python-dotenv==1.1.1"]

[project.optional-dependencies]
dev = ["mypy==1.17.0", "pytest==8.4.1", "ruff==0.12.7"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lzib_movements"]
ignore_missing_imports = true
mypy_path = "src"
